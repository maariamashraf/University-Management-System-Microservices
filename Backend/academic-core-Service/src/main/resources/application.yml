spring:
  application:
    name: academic-core
  datasource:
    url: jdbc:mysql://localhost:3306/helwanuni
    username: root
    password: ${MYSQL_PASSWORD:01125867988}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cache:
    type: redis

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

  aop:
    proxy-target-class: true

server:
  port: 8082

app:
  iam-base-url: ${IAM_BASE_URL:http://localhost:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
